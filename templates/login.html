<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ i18n.login_title }} · {{ i18n.app_title }}</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background:#f7f8ff; margin:0; padding:20px; }
    .box { max-width: 420px; margin: 10vh auto; background:#fff; border:1px solid #e5e7eb; padding:24px; border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input, button, select { width:100%; padding:12px 14px; margin-top:10px; border-radius:12px; border:1px solid #e5e7eb; font:inherit; }
    button { background:#2563eb; color:#fff; border:0; font-weight:700; cursor:pointer; }
    .muted { color:#6b7280; font-size:14px; }
    .error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; padding:10px 12px; border-radius:12px; margin:10px 0; }
    a { color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <form method="get" action="{{ url_for('login') }}" style="margin-bottom:8px;">
      <label for="lang">{{ i18n.language }}</label>
      <select id="lang" name="lang" onchange="this.form.submit()">
        <option value="nl" {% if lang == 'nl' %}selected{% endif %}>{{ i18n.lang_nl }}</option>
        <option value="en" {% if lang == 'en' %}selected{% endif %}>{{ i18n.lang_en }}</option>
      </select>
    </form>

    <h1>{{ i18n.login_title }}</h1>
    <p class="muted">{{ i18n.login_help }}</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      {% if category == 'error' %}<div class="error">{{ message }}</div>{% endif %}
    {% endfor %}
    <form method="post">
      <input type="password" name="password" placeholder="{{ i18n.password }}" autofocus required>
      <button type="submit">{{ i18n.login }}</button>
    </form>
    <p class="muted" style="margin-top:14px"><a href="{{ url_for('dashboard', lang=lang) }}">{{ i18n.back_dashboard }}</a></p>
  </div>
</body>
</html>
