<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen · Baby melk-dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f7f7fb; margin:0; padding:20px; }
    .box { max-width: 420px; margin: 10vh auto; background:#fff; padding:24px; border-radius:20px; box-shadow:0 12px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input, button { width:100%; padding:12px 14px; margin-top:10px; border-radius:14px; border:1px solid #e5e7eb; font:inherit; }
    button { background:#2563eb; color:#fff; border:0; font-weight:700; cursor:pointer; }
    .muted { color:#6b7280; font-size:14px; }
    .error { background:#fef2f2; color:#b91c1c; padding:10px 12px; border-radius:12px; margin:10px 0; }
    a { color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Inloggen</h1>
    <p class="muted">Alleen nodig om nieuwe metingen toe te voegen of te verwijderen.</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      {% if category == 'error' %}<div class="error">{{ message }}</div>{% endif %}
    {% endfor %}
    <form method="post">
      <input type="password" name="password" placeholder="Wachtwoord" autofocus required>
      <button type="submit">Inloggen</button>
    </form>
    <p class="muted" style="margin-top:14px"><a href="{{ url_for('dashboard') }}">Terug naar dashboard</a></p>
  </div>
</body>
</html>
