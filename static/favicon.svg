    <line x1="8" y1="24" x2="20" y2="24" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="28" x2="20" y2="28" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="32" x2="20" y2="32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="36" x2="20" y2="36" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
